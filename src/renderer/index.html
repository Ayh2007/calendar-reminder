<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>行程日历提醒</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="16" rx="2.5"/>
            <path d="M3 9h18"/>
            <path d="M8 2.5v4M16 2.5v4"/>
            <path d="M8.5 13.5h2M13.5 13.5h2M8.5 17h2M13.5 17h2"/>
          </svg>
        </span>
        <span class="brand-name">行程日历提醒</span>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="todayBtn" type="button" title="回到今天">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          今天
        </button>
        <button class="btn icon-btn" id="settingsBtn" type="button" title="设置">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 设置弹层 -->
    <div class="settings-popover hidden" id="settingsPanel">
      <div class="settings-title">设置</div>
      <label class="switch-row">
        <span>
          <span class="switch-label">开机自动启动</span>
          <span class="switch-desc">每次打开电脑自动运行并提醒</span>
        </span>
        <span class="switch"><input type="checkbox" id="swAutoStart" /><span class="slider"></span></span>
      </label>
      <label class="switch-row">
        <span>
          <span class="switch-label">系统通知提醒</span>
          <span class="switch-desc">到点弹出 Windows 通知</span>
        </span>
        <span class="switch"><input type="checkbox" id="swNotify" /><span class="slider"></span></span>
      </label>
      <label class="switch-row">
        <span>
          <span class="switch-label">关闭时最小化到托盘</span>
          <span class="switch-desc">点 × 不退出，在后台继续提醒</span>
        </span>
        <span class="switch"><input type="checkbox" id="swTray" /><span class="slider"></span></span>
      </label>
      <div class="settings-actions">
        <button class="btn ghost small" id="openDataBtn" type="button">打开数据目录</button>
      </div>
      <div class="settings-foot">数据仅保存在本机</div>
    </div>

    <!-- 主体 -->
    <main class="layout">
      <!-- 左：月历 -->
      <section class="pane calendar-pane">
        <div class="cal-header">
          <button class="btn icon-btn" id="prevMonth" type="button" title="上个月">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="cal-title" id="calTitle">2026 年 9 月</div>
          <button class="btn icon-btn" id="nextMonth" type="button" title="下个月">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="cal-weekdays" id="calWeekdays"></div>
        <div class="cal-grid" id="calGrid"></div>
      </section>

      <!-- 右：计划列表 -->
      <section class="pane plans-pane">
        <div class="plans-header">
          <div>
            <div class="plans-date" id="plansDate">今天</div>
            <div class="plans-sub" id="plansSub"></div>
          </div>
          <button class="btn primary" id="addBtn" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            添加计划
          </button>
        </div>

        <!-- 添加表单 -->
        <form class="add-form" id="addForm">
          <div class="add-form-inner">
            <input class="input" id="fTitle" type="text" maxlength="200" placeholder="计划内容，例如：提交项目周报" autocomplete="off" />
            <div class="add-form-row">
              <input class="input time-input" id="fTime" type="time" />
              <input class="input note-input" id="fNote" type="text" maxlength="1000" placeholder="备注（可选）" autocomplete="off" />
            </div>
            <div class="add-form-actions">
              <button class="btn ghost small" id="fCancel" type="button">取消</button>
              <button class="btn primary small" id="fSave" type="submit">保存计划</button>
            </div>
          </div>
        </form>

        <div class="plan-list" id="planList"></div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="app.js"></script>
</body>
</html>
